    <h1>Paris Zalmi</h1>

    <main class="formulaire">

        <p>Pour nous rejoindre, veuillez remplir le formulaire ci-dessous. Le club vous recontactera rapidement.</p>
        
        <form action="inscription_formulaire.php" method="get">

            <label for="title">Civilité :</label>

            <label for="H">Homme</label>
            <input type="radio" id="H" value="H" name="civilité">

            <label for="F">Femme</label>
            <input type="radio" id="F" value="F" name="civilité"><br>

            <label for="lname">Nom :</label>
            <input type="text" id="lname" name="Nom" placeholder="Nom de famille" required><br>

            <label for="fname">Prénom :</label>
            <input type="text" id="fname" name="Prenom" placeholder="Prénom" required><br>

            <label for="email">Email : </label>
            <input type="email" id="email" name="Email" placeholder="pariszalmi@gmail.com" required><br>

            <label for="phone">Tél : </label>
            <input type="tel" id="phone" name="Phone" required><br>

            <label for="bday">Date de naissance</label>
            <input type="date" id="bday" name="birthdate" required><br>

            <label for="role">Rôle</label>
            <select id="role">

                <option value="Batting">Batting</option>
                <option value="Bowling">Bowling</option>
                <option value="All Rounder">All Rounder</option>
                <option value="Wicket-Keeper">Wicket-Keeper</option>

            </select><br>

            <label for="contacturgence">Personne à contacter en cas d'urgence : </label>
            <input type="text" id="contacturgence" name="nameurgentcasecontact" placeholder="Nom" required><br>
            
            <label for="contact_tel">Numéro du contact d'urgence : </label>
            <input type="tel" id="contact_tel" placeholder="Numéro" required><br>

            <input type="submit">
            
        </form>
    </main>

    <footer>

    </footer>
